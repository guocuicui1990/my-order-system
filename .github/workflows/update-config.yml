name: Update Config
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number
        required: true
        type: number
# 添加并发控制，确保同一时间只有一个工作流实例运行
concurrency:
  group: config-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || contains(github.event.issue.labels.*.name, 'config-update')
    
    steps:
    - uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        # 确保获取完整的历史记录
        fetch-depth: 0
        
    - uses: actions/setup-node@v3
      with:
        node-version: 18
        
    - name: Get issue content
      id: issue
      uses: actions/github-script@v7
      with:
        script: |
          let issue;
          if (context.eventName === 'workflow_dispatch') {
            const result = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ github.event.inputs.issue_number || 0 }}
            });
            issue = result.data;
          } else {
            issue = context.payload.issue;
          }
          
          const fs = require('fs');
          fs.writeFileSync('issue.txt', issue.body);
          
          core.setOutput('number', issue.number);
          return issue.number;
          
    - name: Extract config
      id: extract
      run: |
        python3 << 'PYEND'
        import re, json
        content = open('issue.txt').read()
        m = re.search(r'```json\s*([\s\S]*?)\s*```', content)
        if not m:
          m = re.search(r'```\s*([\s\S]*?)\s*```', content)
        if m:
          js = m.group(1)
        else:
          s = content.find('{')
          d = 0
          for i in range(s, len(content)):
            if content[i] == '{': d += 1
            elif content[i] == '}':
              d -= 1
              if d == 0:
                js = content[s:i+1]
                break
        cfg = json.loads(js)
        sid = list(cfg.keys())[0]
        open('new.json', 'w').write(json.dumps(cfg, ensure_ascii=False, indent=2))
        open('sid.txt', 'w').write(sid)
        print(f'Shop ID: {sid}')
        PYEND
        
        echo "shop_id=$(cat sid.txt)" >> $GITHUB_OUTPUT
        
    - name: Update config
      run: |
        node << 'JSEND'
        const fs = require('fs');
        const cfg = JSON.parse(fs.readFileSync('new.json', 'utf8'));
        const sid = Object.keys(cfg)[0];
        const sc = cfg[sid];
        let txt = fs.readFileSync('config.js', 'utf8');
        // 格式化新商家配置字符串（与 config.js 现有风格一致，使用双引号）
        const ns = `    "${sid}": ${JSON.stringify(sc, null, 4)}`;
        if (txt.includes(`"${sid}":`)) {
          // 更新已存在的商家
          const re = new RegExp(
            `"${sid.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}"\\s*:\\s*\\{[\\s\\S]*?\\n\\s*\\}`,
            'm'
          );
          txt = txt.replace(re, ns);
        } else {
          // 精确定位 window.shopConfigs = { 的结束位置（括号匹配算法）
          const marker = 'window.shopConfigs = {';
          const objStart = txt.indexOf(marker);
          if (objStart === -1) throw new Error('未找到 window.shopConfigs 定义');
          let braceCount = 0;
          let inString = false;
          let strChar = '';
          let escape = false;
          let objEnd = -1;
          for (let i = objStart + marker.length; i < txt.length; i++) {
            const c = txt[i];
            if (escape) { escape = false; continue; }
            if (c === '\\' && inString) { escape = true; continue; }
            if ((c === '"' || c === "'") && !inString) {
              inString = true;
              strChar = c;
              continue;
            }
            if (inString && c === strChar) { inString = false; continue; }
            if (!inString) {
              if (c === '{') braceCount++;
              else if (c === '}') {
                if (braceCount === 0) { objEnd = i; break; }
                else braceCount--;
              }
            }
          }
          if (objEnd === -1) throw new Error('无法找到 window.shopConfigs 的结束位置');
          // 判断结束 } 之前最后一个非空白字符，决定是否补逗号
          let lastNonSpace = objEnd - 1;
          while (lastNonSpace >= 0 && /\s/.test(txt[lastNonSpace])) lastNonSpace--;
          const lastChar = txt[lastNonSpace];
          const needComma = lastChar !== ',' && lastChar !== '{';
          const insertStr = (needComma ? ',\n' : '\n') + ns + '\n';
          txt = txt.substring(0, objEnd) + insertStr + txt.substring(objEnd);
        }
        fs.writeFileSync('config.js', txt);
        console.log('Updated:', sid);
        JSEND
        
    - name: Commit and Push with retry
      run: |
        git config user.name Actions
        git config user.email actions@github.com
        git add config.js
        
        # 检查是否有更改
        if git diff --staged --quiet; then
          echo "No changes to commit"
          exit 0
        fi
        
        git commit -m "Update config"
        
        # 重试推送最多3次
        max_attempts=3
        attempt=1
        
        while [ $attempt -le $max_attempts ]; do
          echo "Push attempt $attempt of $max_attempts"
          
          # 在推送前先拉取最新更改
          git pull --rebase origin main
          
          # 尝试推送
          if git push origin main; then
            echo "Push successful"
            exit 0
          else
            echo "Push failed, attempt $attempt"
            attempt=$((attempt + 1))
            
            if [ $attempt -le $max_attempts ]; then
              echo "Waiting 2 seconds before retry..."
              sleep 2
            fi
          fi
        done
        
        echo "Failed to push after $max_attempts attempts"
        exit 1
        
    - name: Comment
      if: success()
      uses: actions/github-script@v7
      with:
        script: |
          await github.rest.issues.createComment({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ steps.issue.outputs.number }},
            body: 'Config updated: `${{ steps.extract.outputs.shop_id }}`'
          });
          await github.rest.issues.update({
            owner: context.repo.owner,
            repo: context.repo.repo,
            issue_number: ${{ steps.issue.outputs.number }},
            state: 'closed'
          });
